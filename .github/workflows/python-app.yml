name: ProAcces TTS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy
        # Nota: pyaudio requiere librerías de audio en Linux CI
        sudo apt-get install -y portaudio19-dev
        pip install pyaudio
        
    - name: Lint with Flake8
      run: |
        pip install flake8
        # Verificación de errores de sintaxis y lógica básica
        flake8 ProAcces-TTS/proacces.py --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Basic Smoke Test
      run: |
        # Verificamos que el motor puede instanciarse sin errores
        python -c "import sys; sys.path.append('ProAcces-TTS'); from proacces import ProAcces; print('Motor ProAcces TTS instanciado correctamente')"
