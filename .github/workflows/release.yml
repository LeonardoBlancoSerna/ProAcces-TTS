name: ProAcces Smart Release v2.1

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.count.outputs.should_release }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - id: count
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD")
          COUNT=$(git rev-list --count $LAST_TAG..HEAD)
          if [ "$COUNT" -ge 2 ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

  build-rhvoice-android:
    needs: check-changes
    if: needs.check-changes.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23b
      - name: Build RHVoice Shared Library (.so)
        run: |
          cd RHVoice
          # scons platform=android (Requiere scons instalado)
          # Por ahora simplificamos el comando de ejemplo
          echo "Compilando RHVoice para Android..."
      - name: Upload RHVoice Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: rhvoice-so
          path: RHVoice/src/android/libs/

  build-windows:
    needs: check-changes
    if: needs.check-changes.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install numpy scipy pywin32 pyinstaller
      - name: Build SAPI5 EXE
        run: |
          pyinstaller --onefile --noconsole --add-data "lang;lang" proacces_sapi5.py
      - name: Upload Windows
        uses: actions/upload-artifact@v3
        with:
          name: ProAcces-Windows
          path: dist/proacces_sapi5.exe

  build-android:
    needs: [check-changes, build-rhvoice-android]
    if: needs.check-changes.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Download RHVoice .so
        uses: actions/download-artifact@v3
        with:
          name: rhvoice-so
          path: libs/
      - name: Build Android APK
        uses: ArtemGr/buildozer-action@v1
        with:
          command: buildozer android debug
      - name: Upload Android
        uses: actions/upload-artifact@v3
        with:
          name: ProAcces-Android
          path: bin/*.apk

  create-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v3
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          generate_release_notes: true
          files: |
            ProAcces-Windows/*.exe
            ProAcces-Android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
